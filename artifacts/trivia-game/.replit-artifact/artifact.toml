kind = "web"
previewPath = "/igc-juegos/"
title = "Preguntados IGC"
version = "1.0.0"
id = "artifacts/trivia-game"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/igc-juegos/" ]
localPort = 23114

[services.development]
run = "pnpm --filter @workspace/trivia-game run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/trivia-game", "run", "build" ]
publicDir = "artifacts/trivia-game/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23114"
BASE_PATH = "/igc-juegos/"
